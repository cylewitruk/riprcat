[package]
name = "riprcat"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cylewitruk/riprcat"
rust-version = "1.85"
publish = false

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
futures = "0.3.32"
reqwest = { version = "0.13.4", default-features = false, features = [
    "rustls",
    "stream",
] }
# TLS: reqwest's rustls feature and the explicit `ring` feature leave the
# process-level provider ambiguous, so `main` installs `ring` explicitly.
rustls = { version = "0.23", features = ["ring"] }
tempfile = "3.27.0"
thiserror = "2.0.18"
tokio = { version = "1.52.3", default-features = false, features = [
    "fs",
    "io-std",
    "io-util",
    "macros",
    "rt-multi-thread",
    "signal",
    "time",
] }

[dev-dependencies]
axum = { version = "0.8.9", features = ["macros"] }
tokio = { version = "1.52.3", default-features = false, features = [
    "net",
    "test-util",
] }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 8
opt-level = 2
